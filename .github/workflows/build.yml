# Build and test CLEF on the SBCL bootstrap host.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: false

      - name: Install SBCL
        run: guix install sbcl

      - name: Run test suite
        run: guix shell sbcl -- sh tools/run-tests.sh sbcl

      - name: Run cold-core smoke test (zero-C ELF executes)
        run: guix shell sbcl -- sh tools/run-smoke.sh sbcl
