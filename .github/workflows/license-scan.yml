# Verifies the clean-room / public-domain invariant (CLEANROOM.md).
# Every source file must carry a CC0 dedication header.
name: license-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every source file has a CC0 header
        run: |
          set -u
          fail=0
          while IFS= read -r -d '' f; do
            if ! head -n 6 "$f" | grep -qiE 'cc0|public domain|creativecommons'; then
              echo "MISSING CC0 HEADER: $f"
              fail=1
            fi
          done < <(git ls-files -z '*.lisp' '*.lsp' '*.cl' '*.asd' '*.scm' '*.sh' '*.py' 2>/dev/null)
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more source files lack a CC0/public-domain header."
            exit 1
          fi
          echo "All tracked source files carry a CC0 header (or no matching files yet)."

      - name: Check no non-PD license references crept into source
        run: |
          # Heuristic tripwire: source files should not embed GPL/LGPL text or
          # copied attribution blocks from other CL implementations.
          if grep -riEl 'gnu general public license|gnu lesser general public' \
               --include='*.lisp' --include='*.asd' --include='*.cl' src test tools 2>/dev/null | grep .; then
            echo "::error::Found GPL/LGPL reference in a source file (see above)."
            exit 1
          fi
          echo "No GPL/LGPL references in source."
